services:
  - type: web
    name: phishguard-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: DATABASE_URL
        value: sqlite:///./phishguard.db
      - key: DEFAULT_ADMIN_EMAIL
        value: admin@phishguard.ac.in
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_USER_EMAIL
        value: student@phishguard.ac.in
      - key: DEFAULT_USER_PASSWORD
        sync: false
      - key: ENABLE_DEMO_LOGIN
        value: "false"

  - type: web
    name: phishguard-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_ORIGIN
        fromService:
          type: web
          name: phishguard-api
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
